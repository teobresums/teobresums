[build-system]
requires = ["setuptools>42", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name="TEOBResumSPy"
version = '3.0.5'
authors =[{name="The TEOBResumS team", email="rossella.gamba@uni-jena.de"}]
description='Python wrapper of TEOBResumS, an Effective-One-Body model for generic coalescing binaries'
classifiers = [
         "Programming Language :: Python :: 3",
         "License :: OSI Approved :: MIT License",
         "Operating System :: OS Independent",
]
readme="PyREADME.md"

[project.urls]
"Homepage"="https://bitbucket.org/eob_ihes/teobresums/src/master/"
"Bug Tracker"="https://bitbucket.org/eob_ihes/teobresums/issues?status=new&status=open"
"Wiki"="https://bitbucket.org/eob_ihes/teobresums/wiki/Conventions,%20parameters%20and%20output"
"Mailing List"="https://lserv.uni-jena.de/mailman/listinfo/teobresums"

