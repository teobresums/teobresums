image: atlassian/default-image:3

pipelines:
    branches:
        '{GIOTTO*,Dali*}':
            - step:
                name: Build C & Run
                script:
                  - apt-get update -y
                  - apt-get install -y libgsl-dev
                  - cd C && make #build C
                  - ./TEOBResumS.x -p par/GW150914.par
                  - ./TEOBResumS.x -p par/GW170817.par
                condition:
                    changesets:
                        includePaths:
                        - "C/src/*"

            - step:
                name: Build EOBRunPy
                script:
                  - apt-get update -y
                  - apt-get install -y libgsl-dev python3-pip
                  - pip3 install --upgrade pip
                  - pip3 install numpy
                  - cd Python && pip install .
                condition:
                    changesets:
                        includePaths:
                        - "C/src/*"
                        - "Python/TEOBResumSWrap.c"

            - step:
                name: Run Tests
                script:
                  - apt-get update -y
                  - apt-get install -y libgsl-dev python3-pip
                  - pip3 install --upgrade pip
                  - pip3 install numpy pytest matplotlib
                  - cd Python && pip install .
                  - cd ../Validation/tests/integration_tests && pytest -v integration_tests.py

            - step:
                name: Build documentation
                script:
                 - apt-get update -y
                 - apt-get -y install doxygen
                 - cp README.md C/src/.
                 - cd C/doxygen && doxygen teob_doc.cfg
                 - tar -cvf doc.tar html/*
                 - curl -X POST "https://${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}@api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" --form files=@"doc.tar"
                artifacts:
                 - C/doxygen/html/**

            - step:
                name: Memory Check
                trigger: manual
                script:
                  - apt-get update -y
                  - apt-get install -y libgsl-dev valgrind
                  - cd C && make
                  - valgrind ./TEOBResumS.x -p par/GW150914.par
                
            - step:
                name: Run Benchmarks
                trigger: manual
                script:
                  - export HOME=$PWD
                  - apt-get update -y
                  - apt-get install -y libgsl-dev python3-pip
                  - pip3 install --upgrade pip
                  - pip3 install numpy
                  - cd C && make #build C
                  - export TEOBRESUMS=$PWD
                  - cd $HOME/Utils/Benchmark && make

            - step:
                name: 'Deploy to Test'
                deployment: test
                trigger: manual
                script:
                  - cd Python
                  - apt-get update -y
                  - apt-get install -y libgsl-dev python3-pip python3.8-venv
                  - pip3 install --upgrade pip
                  - pip3 install build
                  - python3 -m build
                  - python3 -m pip install --upgrade twine
                  - python3 -m twine upload --repository testpypi dist/*.tar.gz -u $PYPI_USERNAME -p $PYPI_PASSWORD

            - step:
                name: 'Deploy to Production'
                deployment: production
                trigger: manual
                script:
                  - cd Python
                  - apt-get update -y
                  - apt-get install -y libgsl-dev python3-pip python3.8-venv
                  - pip3 install --upgrade pip
                  - pip3 install build
                  - python3 -m build
                  - python3 -m pip install --upgrade twine
                  - python3 -m twine upload -u $PYPI_USERNAME -p $PYPI_PASSWORD dist/*.tar.gz
